services:
  - type: web
    name: control-laboral-ia
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: APP_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PATH
        value: /var/data/mi_trabajo.db
      - key: BACKUP_DIR
        value: /var/data/copias_seguridad
    disk:
      name: datos-laborales
      mountPath: /var/data
      sizeGB: 1
  - type: cron
    name: control-laboral-auto-fichaje
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python auto_clock.py
    # Render schedules use UTC. These two runs let the script hit 16:00 in the Canary Islands year-round.
    schedule: "0 15,16 * * 1-5"
    envVars:
      - key: DATABASE_URL
        fromService:
          name: control-laboral-privado
          type: web
          envVarKey: DATABASE_URL


