name: Verify app

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax-and-sqlite-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile app.py scripts/import_sqlite_to_neon.py
      - name: Smoke test SQLite backend
        env:
          DATABASE_PATH: /tmp/control-laboral-test.db
          BACKUP_DIR: /tmp/control-laboral-backups
          APP_PASSWORD: test-password
          SECRET_KEY: test-secret-key
        run: |
          python - <<'PY'
          import app as module
          client = module.app.test_client()
          response = client.post("/login", data={"password": "test-password"}, follow_redirects=True)
          assert response.status_code == 200, response.status_code
          response = client.get("/")
          assert response.status_code == 200, response.status_code
          response = client.post("/login?next=https://example.com", data={"password": "test-password"})
          assert response.status_code == 302, response.status_code
          assert response.headers["Location"] == "/", response.headers.get("Location")
          with module.db() as con:
              hours = con.execute("SELECT COALESCE(SUM(horas_extra), 0) AS n FROM jornadas").fetchone()["n"]
              trips = con.execute("SELECT COALESCE(SUM(importe), 0) AS n FROM viajes WHERE pagado=0").fetchone()["n"]
          assert float(hours) == 39.5, hours
          assert float(trips) == 400.0, trips
          print("SQLite smoke test OK: 39.5 overtime hours, 400 EUR pending.")
          PY

  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: laboral_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d laboral_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Smoke test PostgreSQL backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/laboral_test
          BACKUP_DIR: /tmp/control-laboral-backups
          APP_PASSWORD: test-password
          SECRET_KEY: test-secret-key
        run: |
          python - <<'PY'
          import os
          import app as module
          client = module.app.test_client()
          response = client.post("/login", data={"password": "test-password"}, follow_redirects=True)
          assert response.status_code == 200, response.status_code
          response = client.get("/")
          assert response.status_code == 200, response.status_code
          response = client.post("/login?next=https://example.com", data={"password": "test-password"})
          assert response.status_code == 302, response.status_code
          assert response.headers["Location"] == "/", response.headers.get("Location")
          with module.db() as con:
              hours = con.execute("SELECT COALESCE(SUM(horas_extra), 0) AS n FROM jornadas").fetchone()["n"]
              trips = con.execute("SELECT COALESCE(SUM(importe), 0) AS n FROM viajes WHERE pagado=0").fetchone()["n"]
          assert float(hours) == 39.5, hours
          assert float(trips) == 400.0, trips
          with module.app.test_client() as client:
              with client.session_transaction() as session:
                  session["logged_in"] = True
              response = client.post("/backup", follow_redirects=True)
              assert response.status_code == 200, response.status_code
              files = os.listdir(os.environ["BACKUP_DIR"])
              assert any(name.endswith(".json") for name in files), files
          print("PostgreSQL smoke test OK: dashboard, 39.5 overtime hours, 400 EUR pending, JSON backup.")
          PY
